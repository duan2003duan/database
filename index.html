<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Electric AI Dataset</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-top: 20px;
      margin-bottom: 10px;
    }

    p.description {
      color: #666;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 18px;
      max-width: 1500px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 8px;
      display: block;
    }

    .filename {
      margin-top: 10px;
      font-size: 14px;
      color: #333;
      word-break: break-all;
    }
  </style>
</head>
<body>

  <h1>Electric AI Image Dataset</h1>
  <p class="description">Conductor Images (Total: 2229)</p>

  <div class="gallery" id="gallery"></div>

  <script>
    const gallery = document.getElementById("gallery");

    for (let i = 2; i <= 2230; i++) {
      const num = String(i).padStart(3, '0');
      const fileName = `Conductor_${num}.png`;

      const card = document.createElement("div");
      card.className = "card";

      const img = document.createElement("img");
      img.src = fileName;
      img.alt = fileName;

      const name = document.createElement("div");
      name.className = "filename";
      name.textContent = fileName;

      card.appendChild(img);
      card.appendChild(name);
      gallery.appendChild(card);
    }
  </script>

</body>
</html>
