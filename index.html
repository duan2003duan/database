<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Electric AI Dataset</title>

<style>

body{
    font-family: Arial;
    background:#f5f5f5;
    text-align:center;
}

h1{
    margin-top:30px;
}

.gallery{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
}

.card{
    background:white;
    margin:10px;
    padding:10px;
    border-radius:10px;
}

img{
    width:250px;
    height:180px;
    object-fit:cover;
}

</style>

</head>


<body>

<h1>Electric AI Image Dataset</h1>

<p>Conductor Images</p>


<div class="gallery">


<script>

for(let i=2;i<=400;i++){

let num=i.toString().padStart(3,'0');

document.write(`

<div class="card">

<img src="Conductor_${num}.png">

<p>Conductor_${num}.png</p>

</div>

`);

}

</script>


</div>


</body>

</html>
